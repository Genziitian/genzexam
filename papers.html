<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice Papers · Quiz LAB</title>
  <meta name="description" content="Browse IITM BS practice papers and exam prep. Start free papers straight away or buy a paper securely with Razorpay." />
  <meta name="theme-color" content="#1f3d22" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/papers.css?v=20261008e">
  <script src="/ql-theme.js?v=20261008e"></script>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="/"><img class="mark" src="/assets/quiz-lab-icon.png" alt="" width="34" height="34"><span>Quiz LAB<small>by GenZ IITian</small></span></a>
  <nav class="navlinks" aria-label="Main navigation"><a href="#catalog" class="active" aria-current="page">Papers</a><a href="/#modes">How it works</a><a href="/leaderboard">Leaderboard</a><button type="button" class="theme-toggle" data-ql-theme-toggle aria-label="Switch theme"></button></nav>
  <div class="navend"><a class="btn primary" href="/dashboard">Dashboard</a></div>
</div></header>
<main class="wrap">
  <section class="hero" id="catalog">
    <div class="eyebrow">Quiz LAB · IITM BS</div>
    <div class="hero-row">
      <h1>Find your next paper.<br><em style="color:var(--green)">Practice at your pace.</em></h1>
      <div class="hero-actions"><a class="btn primary" href="/practice">Browse free papers</a><a class="btn soft" href="/practice">Try a sample question</a></div>
    </div>
  </section>
  <section id="catalog-view">
    <div class="filters" aria-label="Filter papers">
      <input id="search" type="search" placeholder="Search papers or courses" aria-label="Search papers or courses">
      <select id="level-filter" aria-label="Level"><option value="">All levels</option></select>
      <select id="type-filter" aria-label="Paper type"><option value="">All types</option><option value="quiz1">Quiz 1</option><option value="quiz2">Quiz 2</option><option value="endterm">End Term</option><option value="mock_test">Mock test</option><option value="practice">Practice</option><option value="practice_graded">Graded practice</option></select>
      <select id="price-filter" aria-label="Price"><option value="">All prices</option><option value="free">Free</option><option value="paid">Paid</option></select>
    </div>
    <div class="section-head"><h2>Available papers</h2><span class="count" id="result-count"></span></div>
    <div class="grid" id="paper-grid" aria-live="polite"><div class="loading">Loading the paper catalog…</div></div>
  </section>
</main>
<footer><div class="wrap">Quiz LAB by GenZ IITian · Built by students, for students</div></footer>
<dialog id="paper-details" aria-labelledby="details-title">
  <div class="dialog-head"><span class="eyebrow">Paper details</span><button class="btn" id="close-details" aria-label="Close paper details">Close</button></div>
  <div id="details-content"></div>
  <p id="details-status" role="status" aria-live="polite"></p>
  <button class="btn primary" id="details-action"></button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/storefront-runtime.js?v=20261008e"></script>
<script src="/papers.js?v=20261008e"></script>
</body>
</html>
