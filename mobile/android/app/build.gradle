plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: android/key.properties (never committed) points at the upload keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
        keystoreProperties["storeFile"] && keystoreProperties["storePassword"] &&
        keystoreProperties["keyAlias"] && keystoreProperties["keyPassword"]

android {
    namespace = "in.genziitian.quizlab"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "in.genziitian.quizlab"
        minSdk = flutter.minSdkVersion
        // Google Play requires API 36 for new apps and updates from August 31, 2026.
        targetSdk = 36
        // Both come from `version:` in pubspec.yaml (name+code).
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Keep local --release runs possible, but block release artifacts below unless signed
            // with the configured upload key. Never let a debug-signed AAB reach Play Console.
            signingConfig = releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                    "Google Play release signing is not configured. Create android/key.properties " +
                    "and point it to your upload keystore before building an AAB."
            )
        }
        def uploadKey = rootProject.file(keystoreProperties["storeFile"])
        if (!uploadKey.isFile()) {
            throw new GradleException("Upload keystore not found: ${uploadKey}")
        }
    }
}

// Check the resolved Android dependency, not just the Dart plugin version.
// Google Play's regular submission deadline for Billing 7 was August 31, 2026.
tasks.register("validateReleaseBilling") {
    doLast {
        def billing = configurations.releaseRuntimeClasspath.incoming.resolutionResult
                .allComponents.find {
                    it.moduleVersion?.group == "com.android.billingclient" &&
                            it.moduleVersion?.name == "billing"
                }?.moduleVersion
        if (billing == null || billing.version.tokenize('.')[0].toInteger() < 8) {
            throw new GradleException(
                    "Google Play releases require Billing Library 8 or newer. Resolved: ${billing}. " +
                    "Update in_app_purchase and in_app_purchase_android, then run flutter pub get."
            )
        }
        logger.lifecycle("Verified release Google Play Billing Library ${billing.version}")
    }
}

tasks.matching { it.name == "bundleRelease" || it.name == "assembleRelease" }.configureEach {
    dependsOn("validateReleaseSigning")
    dependsOn("validateReleaseBilling")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
