name: Build Quiz Lab Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build_android_apk.yml'
    branches: [ main, backend ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform Scaffolding
        working-directory: mobile
        run: |
          mkdir -p /tmp/res_backup
          cp -r android/app/src/main/res /tmp/res_backup/ 2>/dev/null || true
          rm -rf android
          flutter create --platforms=android --org in.genziitian .
          cp -r /tmp/res_backup/res/* android/app/src/main/res/ 2>/dev/null || true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-lab-release-apk
          path: mobile/build/app/outputs/**/*.apk
          retention-days: 14

