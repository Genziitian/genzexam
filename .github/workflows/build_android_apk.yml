name: Build Quiz Lab Android APK

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build_android_apk.yml'
    branches: [ main, backend ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release App Bundle (.aab for Google Play Store)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build appbundle --release --no-shrink 2>&1 | tee /tmp/flutter_build_aab.log

      - name: Build Release APK (.apk for Direct Device Testing)
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee /tmp/flutter_build_apk.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: /tmp/flutter_build_*.log

      - name: Upload Google Play AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quiz-lab-release-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload APK Tester Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quiz-lab-release-apk
          path: mobile/build/app/outputs/**/*.apk
          retention-days: 14

