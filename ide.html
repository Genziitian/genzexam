<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice IDE · Quiz LAB</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<style>
  :root {
    --bg: #f4f5f8; --panel: #fff; --ink: #1f2430; --muted: #6b7280; --line: #e5e7ee;
    --brand: #3a3fd8; --brand-soft: #eceeff; --locked: #e6e6e8; --locked-ink: #6b6f7a;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141b; --panel: #1b1e28; --ink: #e8eaf0; --muted: #9aa1b2; --line: #2a2e3b;
      --brand: #8b90ff; --brand-soft: #262a4a; --locked: #2c2f3a; --locked-ink: #8e94a6;
      --ok: #4ade80; --ok-bg: #123524; --bad: #f87171; --bad-bg: #3b1a1a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(280px, 1fr) minmax(320px, 1.2fr); gap: 12px; padding: 12px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 9px; color: var(--muted); font: 600 14px inherit; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
  .tab:disabled { opacity: .55; cursor: not-allowed; }
  .tabpanel { flex: 1; overflow: auto; padding: 18px 20px; }
  .tabpanel[hidden] { display: none; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 6px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; text-transform: capitalize; margin-right: 6px; }
  .text { white-space: pre-wrap; word-wrap: break-word; }
  pre.io { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; overflow: auto; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .toolbar .lang { padding: 7px 14px; background: var(--bg); border-radius: 8px; font-weight: 600; font-size: 14px; }
  .toolbar .spacer { flex: 1; }
  button.btn { padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: 600 14px inherit; cursor: pointer; }
  button.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.btn:disabled { opacity: .55; cursor: wait; }
  .btn.sm { padding: 6px 12px; font-size: 12px; letter-spacing: .06em; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .actions .btn { padding: 10px 22px; }
  #editorWrap { flex: 1; min-height: 0; position: relative; }
  .CodeMirror { height: 100%; font: 13.5px/1.55 ui-monospace, Menlo, Consolas, monospace; background: var(--panel); color: var(--ink); }
  .CodeMirror-gutters { background: var(--panel); border-right: 1px solid var(--line); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left-color: var(--ink); }
  .CodeMirror .locked-line { background: var(--locked); color: var(--locked-ink); cursor: not-allowed; }
  .CodeMirror .locked-line span { color: var(--locked-ink) !important; }
  .cm-s-default .cm-keyword { color: #a626a4; } .cm-s-default .cm-string { color: #50a14f; } .cm-s-default .cm-number { color: #986801; }
  .cm-s-default .cm-comment { color: #8a8f9c; } .cm-s-default .cm-builtin { color: #0184bc; } .cm-s-default .cm-def { color: #4078f2; }
  #result { border-top: 1px solid var(--line); max-height: 38%; overflow: auto; padding: 10px 14px; display: none; }
  #result.show { display: block; }
  .verdict { font-weight: 700; margin-bottom: 8px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .case { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 8px 10px; }
  .case .hd { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .pill { padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .case pre.io { margin-top: 4px; }
  .case small { color: var(--muted); font-weight: 600; }
  .sub { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .sub button { margin-left: auto; }
  .msg { color: var(--muted); padding: 40px 20px; text-align: center; }
  .msg a { color: var(--brand); font-weight: 600; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; padding: 14px 10px; }
  .side .top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .side .top .back2 { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--brand); font: 600 13px inherit; cursor: pointer; }
  .side .top .collapse { margin-left: auto; display: inline-flex; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted); cursor: pointer; }
  .side h4 { margin: 0 8px 12px; font-size: 14px; }
  main.side-collapsed { grid-template-columns: 52px minmax(280px, 1fr) minmax(320px, 1.2fr); }
  main.side-collapsed .side > :not(.top) { display: none; }
  main.side-collapsed .side .top > :not(.collapse) { display: none; }
  main.side-collapsed .side .top .collapse { margin: 0 auto; transform: scaleX(-1); }
  .gsec { --c: #6366f1; margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .gsec:last-child { border-bottom: 0; }
  .gsec.s2 { --c: #14b8a6; } .gsec.s3 { --c: #f59e0b; } .gsec.s4 { --c: #ec4899; }
  .side .sechead { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 4px; padding: 8px 10px; border: 0; border-left: 3px solid var(--c); border-radius: 6px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--ink); font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .side .sechead svg { margin-left: auto; transition: transform .15s; }
  .gsec.shut .sechead svg { transform: rotate(-90deg); }
  .gsec.shut button.item { display: none; }
  .side button.on { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); box-shadow: inset 3px 0 0 var(--c); }
  .ic { display: inline-flex; vertical-align: -2px; }
  .pane.fs { position: fixed; inset: 0; z-index: 50; border-radius: 0; border: 0; }
  body.fs-on { overflow: hidden; }
  .mini { display: none; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .pane.fs .mini.show { display: flex; }
  .mini.ok { color: var(--ok); } .mini.bad { color: var(--bad); }
  .mini button { margin-left: auto; }
  .side .sec { margin: 14px 8px 6px; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 2px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: 500 13px inherit; cursor: pointer; }
  .side button:hover { background: var(--bg); }
  .side button.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  .side button .tick { margin-left: auto; color: var(--ok); font-weight: 700; }
  @media (max-width: 1100px) { main { grid-template-columns: 200px minmax(240px, 1fr) minmax(280px, 1.2fr); } }
  @media (max-width: 820px) {
    .side { max-height: 190px; }
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; }
    .pane { min-height: 70vh; }
    #editorWrap { min-height: 420px; }
    }
</style>
</head>
<body>
<main id="app" hidden>
  <aside class="side" id="side" aria-label="Sections and problems"></aside>
  <section class="pane" aria-label="Problem">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="question">Question</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cases">Test Cases</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="result">Result</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="subs">Submissions</button>
      <button class="tab" role="tab" aria-selected="false" disabled title="Solution is locked">Solution <span class="ic" data-i="lock"></span></button>
      <button class="btn" id="reportBtn" style="margin:6px 0 6px auto" title="Report a problem with this question"><span class="ic" data-i="flag"></span> Report</button>
    </div>
    <div class="tabpanel" id="tab-question" role="tabpanel"></div>
    <div class="tabpanel" id="tab-cases" role="tabpanel" hidden></div>
    <div class="tabpanel" id="tab-result" role="tabpanel" hidden><div class="msg">Press Run or Submit to see your results here.</div></div>
    <div class="tabpanel" id="tab-subs" role="tabpanel" hidden></div>
  </section>
  <section class="pane" id="codePane" aria-label="Code">
    <div class="tabs"><button class="tab" aria-selected="true">Code</button></div>
    <div class="toolbar">
      <span class="lang" id="lang">Python3</span>
      <span class="spacer"></span>
      <button class="btn sm" id="copyBtn" title="Copy the code">COPY</button>
      <button class="btn sm" id="resetBtn" title="Restore starter code">RESET</button>
      <button class="btn sm" id="fsBtn" title="Full screen code editor" aria-label="Full screen code editor"><span class="ic" data-i="expand"></span></button>
    </div>
    <div id="editorWrap"></div>
    <div class="mini" id="miniResult"><span id="miniText"></span><button class="btn sm" id="miniMore" type="button">View details</button></div>
    <div class="actions">
      <button class="btn" id="runBtn"><span class="ic" data-i="play"></span> Run Code</button>
      <button class="btn primary" id="submitBtn"><span class="ic" data-i="check"></span> Submit</button>
    </div>
  </section>
</main>
<dialog id="reportDlg" style="border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;max-width:440px;width:calc(100% - 32px)">
  <form method="dialog" id="reportForm">
    <h2 style="margin:0 0 4px;font-size:18px">Report this question</h2>
    <p style="margin:0 0 12px;color:var(--muted);font-size:13px">What is wrong? Pick all that apply.</p>
    <div id="reportReasons"></div>
    <textarea id="reportComment" maxlength="1000" rows="3" placeholder="Tell us more (optional)" style="width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"></textarea>
    <p id="reportMsg" style="min-height:18px;margin:8px 0 0;font-size:13px"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button type="button" class="btn" id="reportCancel">Cancel</button>
      <button type="submit" class="btn primary" id="reportSend">Send report</button>
    </div>
  </form>
</dialog>
<div class="msg" id="status">Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
(function () {
  "use strict";
  var API = ((window.QLStorefront && window.QLStorefront.apiBase) || "https://labapi.genziitian.in/public/api").replace(/\/$/, "");
  var params = new URLSearchParams(location.search);
  var courseSlug = params.get("course") || "python";
  var $ = function (id) { return document.getElementById(id); };
  var token = ""; try { token = localStorage.getItem("lab_token") || ""; } catch (e) {}
  var papers = [];            // [{name, problems:[...]}] grouped from /courses/:slug/ide-problems
  var problems = [];          // problems of the paper being solved
  var current = null;         // full problem
  var cm = null, P = 0, S = 0; // codemirror, prefix line count, suffix line count
  var busy = false;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function solvedSet() { try { return JSON.parse(localStorage.getItem("ide.solved") || "[]"); } catch (e) { return []; } }
  function markSolved(id) { var a = solvedSet(); if (a.indexOf(id) < 0) { a.push(id); try { localStorage.setItem("ide.solved", JSON.stringify(a)); } catch (e) {} } }
  var ICONS = {
    back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>',
    panel: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
    expand: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
    shrink: '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>',
    flag: '<path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"/>',
    play: '<polygon points="6 4 20 12 6 20 6 4"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
  };
  function icon(name, size) { return '<svg width="' + (size || 14) + '" height="' + (size || 14) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  document.querySelectorAll("[data-i]").forEach(function (n) { n.innerHTML = icon(n.dataset.i); });
  function status(html) { var s = $("status"); s.hidden = false; $("app").hidden = true; s.textContent = ""; if (html) s.appendChild(html); }
  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || "GET",
          body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || ("Request failed (" + r.status + ")")); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function loginPrompt() {
    var d = el("div"); d.appendChild(document.createTextNode("Please log in to use the IDE. "));
    var a = el("a", "", "Log in"); a.href = "/login"; d.appendChild(a); status(d);
  }

  // Titles look like "<paper> · P1: <name>"; the paper part groups problems, the rest is shown as the question name.
  // Types a programming course can have, in display order. A title starting with one of these decides the type.
  var TYPES = [["GrPA", /^GrPA/i], ["Quiz 1", /^Quiz ?1\b/i], ["OPPE 1", /^OPPE ?1\b/i], ["OPPE 2", /^OPPE ?2\b/i], ["End Term", /^End ?Term/i]];
  function typeOf(title) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i][1].test(title)) return TYPES[i][0]; return null; }
  function split(p) {
    var m = /^(.*?) · P\d+: (.*)$/.exec(p.title);
    if (m) return { paper: m[1], name: m[2] };
    // One-question items (a whole GrPA, for example) are grouped by week under their type.
    var t = typeOf(p.title) || "Practice";
    return { paper: t + (p.week_number ? " · Week " + p.week_number : ""), name: p.title };
  }

  // ---- tabs
  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("[data-tab]").forEach(function (x) { x.setAttribute("aria-selected", String(x === b)); });
      ["question", "cases", "result", "subs"].forEach(function (t) { $("tab-" + t).hidden = t !== b.dataset.tab; });
      if (b.dataset.tab === "subs") loadSubmissions();
    });
  });
  function showTab(name) { document.querySelector('[data-tab="' + name + '"]').click(); }

  // ---- question rendering
  function section(parent, title, node) { parent.appendChild(el("h3", "", title)); parent.appendChild(node); }
  function textBlock(t) { return el("div", "text", t); }
  function ioBlock(t) { return el("pre", "io", t); }
  function renderQuestion(p) {
    var box = $("tab-question"); box.textContent = "";
    box.appendChild(el("h1", "", split(p).name));
    var meta = el("div"); meta.appendChild(el("span", "badge", split(p).paper)); meta.appendChild(el("span", "badge", p.difficulty || "medium"));
    if (p.week_number) meta.appendChild(el("span", "badge", "Week " + p.week_number));
    box.appendChild(meta);
    box.appendChild(el("div", "", "")).style.height = "10px";
    box.appendChild(textBlock(p.description));
    if (p.input_format) section(box, "Input format", textBlock(p.input_format));
    if (p.output_format) section(box, "Output format", textBlock(p.output_format));
    if (p.constraints) section(box, "Constraints", textBlock(p.constraints));
    section(box, "Sample input", ioBlock(p.sample_input));
    section(box, "Sample output", ioBlock(p.sample_output));
    var cases = $("tab-cases"); cases.textContent = "";
    (p.test_cases || []).forEach(function (c, i) {
      var d = el("div", "case"); d.appendChild(el("div", "hd", "Case " + (i + 1)));
      d.appendChild(el("small", "", "Input")); d.appendChild(ioBlock(c.input));
      d.appendChild(el("small", "", "Expected output")); d.appendChild(ioBlock(c.expected_output));
      cases.appendChild(d);
    });
    if (!(p.test_cases || []).length) cases.appendChild(el("div", "msg", "No public test cases."));
    var hidden = $("tab-cases");
    hidden.appendChild(el("div", "msg", "More hidden cases are checked when you Submit."));
  }

  // ---- editor with locked grey prefix / suffix
  function lineCount(t) { return t ? t.replace(/\r\n/g, "\n").replace(/\n+$/, "").split("\n").length : 0; }
  function clean(t) { return (t || "").replace(/\r\n/g, "\n").replace(/^\n+|\n+$/g, ""); }
  function draftKey(p) { return "ide.draft." + p.id; }
  function initialMiddle(p) {
    var saved = null; try { saved = localStorage.getItem(draftKey(p)); } catch (e) {}
    if (saved != null) return saved;
    return p.starter_code != null && p.starter_code !== "" ? p.starter_code.replace(/\r\n/g, "\n") : "";
  }
  function buildEditor(p, middle) {
    var prefix = clean(p.prefix_code), suffix = clean(p.suffix_code);
    P = lineCount(prefix); S = lineCount(suffix);
    middle = (middle || "").replace(/\r\n/g, "\n");
    var doc = [prefix, middle, suffix].filter(function (x, i) { return i === 1 || x !== ""; }).join("\n");
    if (cm) { cm.toTextArea && 0; $("editorWrap").textContent = ""; }
    cm = CodeMirror($("editorWrap"), { value: doc, mode: "python", lineNumbers: true, indentUnit: 4, indentWithTabs: false, lineWrapping: false,
      extraKeys: { Tab: function (c) { c.replaceSelection("    ", "end"); }, "Shift-Tab": "indentLess" } });
    function paintLocked() {
      var total = cm.lineCount();
      for (var i = 0; i < total; i++) {
        var locked = i < P || i >= total - S;
        cm[locked ? "addLineClass" : "removeLineClass"](i, "wrap", "locked-line");
      }
    }
    cm.on("beforeChange", function (inst, ch) {
      if (ch.origin === "setValue") return;
      var last = inst.lineCount() - S - 1;
      if (ch.from.line < P || ch.to.line > last) ch.cancel();
    });
    cm.on("change", function () {
      paintLocked();
      try { localStorage.setItem(draftKey(p), studentCode()); } catch (e) {}
    });
    paintLocked();
    // put caret in the editable area
    cm.setCursor({ line: P, ch: (cm.getLine(P) || "").length });
    setTimeout(function () { cm.refresh(); }, 0);
  }
  function studentCode() {
    var total = cm.lineCount(), out = [];
    for (var i = P; i < total - S; i++) out.push(cm.getLine(i));
    return out.join("\n");
  }

  // ---- results
  function showResult(node) {
    var r = $("tab-result"); r.textContent = ""; r.appendChild(node); showTab("result");
    // In full screen the left panel is hidden, so the verdict is also shown under the editor.
    var v = node.querySelector && node.querySelector(".verdict"), mini = $("miniResult");
    mini.classList.toggle("show", !!v); mini.classList.remove("ok", "bad");
    if (v) { $("miniText").textContent = v.textContent; mini.classList.add(v.classList.contains("ok") ? "ok" : "bad"); }
  }
  // ---- full screen code editor
  function setFs(on) {
    $("codePane").classList.toggle("fs", on); document.body.classList.toggle("fs-on", on);
    $("fsBtn").innerHTML = icon(on ? "shrink" : "expand"); $("fsBtn").title = on ? "Exit full screen" : "Full screen code editor";
    if (cm) setTimeout(function () { cm.refresh(); }, 0);
  }
  $("fsBtn").addEventListener("click", function () { setFs(!$("codePane").classList.contains("fs")); });
  $("miniMore").addEventListener("click", function () { setFs(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("codePane").classList.contains("fs")) setFs(false); });
  function resultList(results) {
    var wrap = el("div");
    results.forEach(function (c) {
      var d = el("div", "case"), hd = el("div", "hd");
      hd.appendChild(el("span", "", "Case " + c.case_number + (c.is_hidden ? " (hidden)" : "")));
      hd.appendChild(el("span", "pill " + (c.passed ? "ok" : "bad"), c.passed ? "Passed" : "Failed"));
      d.appendChild(hd);
      if (!c.is_hidden) {
        d.appendChild(el("small", "", "Input")); d.appendChild(ioBlock(c.input || ""));
        d.appendChild(el("small", "", "Expected")); d.appendChild(ioBlock(c.expected || ""));
        d.appendChild(el("small", "", "Your output")); d.appendChild(ioBlock(c.got || ""));
        if (c.error) { d.appendChild(el("small", "", "Error")); var er = ioBlock(c.error); er.style.color = "var(--bad)"; d.appendChild(er); }
      }
      wrap.appendChild(d);
    });
    return wrap;
  }
  function setBusy(b) { busy = b; $("runBtn").disabled = b; $("submitBtn").disabled = b; }
  function execute(kind) {
    if (busy || !current) return;
    var code = studentCode();
    if (!code.trim()) { showResult(el("div", "verdict bad", "Write some code first.")); return; }
    setBusy(true);
    showResult(el("div", "", kind === "run" ? "Running…" : "Submitting…"));
    api("/ide-problems/" + current.id + "/" + kind, { method: "POST", body: { language: current.language === "c++" ? "cpp" : (current.language || "python"), code: code } })
      .then(function (res) {
        var box = el("div"), results = res.test_results || [];
        var passed = results.filter(function (c) { return c.passed; }).length;
        if (kind === "submit") {
          var ok = res.status === "accepted"; if (ok) markSolved(current.id);
          box.appendChild(el("div", "verdict " + (ok ? "ok" : "bad"), (ok ? "Accepted" : String(res.status || "").replace(/_/g, " ")) + " — " + res.passed_cases + "/" + res.total_cases + " cases passed"));
          loadSubmissionsSoon();
        } else {
          box.appendChild(el("div", "verdict " + (passed === results.length ? "ok" : "bad"), passed + "/" + results.length + " sample cases passed"));
        }
        box.appendChild(resultList(results)); showResult(box);
      })
      .catch(function (e) { if (e.status === 401) return loginPrompt(); showResult(el("div", "verdict bad", e.message)); })
      .then(function () { setBusy(false); });
  }
  $("runBtn").addEventListener("click", function () { execute("run"); });
  $("submitBtn").addEventListener("click", function () { if (!busy && confirm("Submit your code for this question? Your attempt will be recorded.")) execute("submit"); });
  $("copyBtn").addEventListener("click", function () {
    if (!cm) return;
    var b = $("copyBtn"), done = function () { b.textContent = "COPIED"; setTimeout(function () { b.textContent = "COPY"; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(cm.getValue()).then(done, function () {});
  });
  $("resetBtn").addEventListener("click", function () {
    if (!current || !confirm("Reset your code? Everything you wrote will be replaced by the starter code.")) return;
    try { localStorage.removeItem(draftKey(current)); } catch (e) {}
    buildEditor(current, initialMiddle(current));
  });

  // ---- submissions
  var subsTimer;
  function loadSubmissionsSoon() { clearTimeout(subsTimer); subsTimer = setTimeout(loadSubmissions, 300); }
  function loadSubmissions() {
    if (!current) return;
    var box = $("tab-subs"); box.textContent = "Loading…";
    api("/ide-problems/" + current.id + "/my-submissions").then(function (list) {
      box.textContent = "";
      if (!list.length) return box.appendChild(el("div", "msg", "No submissions yet."));
      list.forEach(function (s) {
        var row = el("div", "sub");
        var ok = s.status === "accepted";
        row.appendChild(el("span", "pill " + (ok ? "ok" : "bad"), String(s.status).replace(/_/g, " ")));
        row.appendChild(el("span", "", s.submitted_at ? new Date(s.submitted_at).toLocaleString() : ""));
        var b = el("button", "btn", "Load code");
        b.addEventListener("click", function () {
          api("/ide-problems/" + current.id + "?submission_id=" + s.id).then(function (r) {
            if (r.selected_submission) buildEditor(current, middleFrom(r.selected_submission.code));
          });
        });
        row.appendChild(b); box.appendChild(row);
      });
    }).catch(function (e) { box.textContent = e.message; });
  }
  // A stored submission holds only the student's part (see IDEController::submit), so it drops straight into the editable area.
  function middleFrom(code) { return code || ""; }

  // ---- problem loading
  function openProblem(id) {
    status(document.createTextNode("Loading…"));
    api("/ide-problems/" + id).then(function (res) {
      current = res.problem;
      $("status").hidden = true; $("app").hidden = false;
      $("lang").textContent = ({ python: "Python3", java: "Java", cpp: "C++", "c++": "C++" })[current.language] || current.language;
      renderQuestion(current); buildEditor(current, initialMiddle(current));
      $("tab-result").innerHTML = '<div class="msg">Press Run or Submit to see your results here.</div>'; $("miniResult").classList.remove("show"); showTab("question");
      var url = new URL(location.href); url.searchParams.set("problem", id); history.replaceState(null, "", url);
      var idx = problems.findIndex(function (x) { return x.id === id; });
      renderSide(id);
    }).catch(function (e) { if (e.status === 401) loginPrompt(); else status(document.createTextNode(e.message)); });
  }

  // ---- report a problem with the question
  var REPORT_REASONS = [["ide_statement", "The problem statement is wrong or unclear"], ["ide_testcase", "A test case or expected output is wrong"], ["ide_sample", "The sample input or output is wrong"], ["ide_template", "The given (locked) code or function template is wrong"], ["ide_format", "The input or output format is wrong or missing"], ["typo", "Typo or unclear wording"], ["other", "Something else is wrong"]];
  var rList = $("reportReasons");
  REPORT_REASONS.forEach(function (r) {
    var lab = el("label"); lab.style.cssText = "display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer";
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.value = r[0];
    lab.appendChild(cb); lab.appendChild(document.createTextNode(r[1])); rList.appendChild(lab);
  });
  $("reportBtn").addEventListener("click", function () {
    rList.querySelectorAll("input").forEach(function (c) { c.checked = false; });
    $("reportComment").value = ""; $("reportMsg").textContent = ""; $("reportSend").disabled = false;
    $("reportDlg").showModal();
  });
  $("reportCancel").addEventListener("click", function () { $("reportDlg").close(); });
  $("reportForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var reasons = Array.prototype.map.call(rList.querySelectorAll("input:checked"), function (c) { return c.value; });
    var msg = $("reportMsg");
    if (!reasons.length) { msg.style.color = "var(--bad)"; msg.textContent = "Pick at least one reason."; return; }
    $("reportSend").disabled = true; msg.style.color = "var(--muted)"; msg.textContent = "Sending…";
    api("/ide-problems/" + current.id + "/report", { method: "POST", body: { reasons: reasons, comment: $("reportComment").value.trim() || null } })
      .then(function () { msg.style.color = "var(--ok)"; msg.textContent = "Thanks! We will check this question."; setTimeout(function () { $("reportDlg").close(); }, 1200); })
      .catch(function (err) { $("reportSend").disabled = false; msg.style.color = "var(--bad)"; msg.textContent = err.message; });
  });

  // ---- papers list (landing) and per-paper navigation
  // sort_order = section * 100 + position (set by the seeder); admin-made problems have a small sort_order and no sections.
  function sectionOf(p) { return p.sort_order >= 100 ? Math.floor(p.sort_order / 100) : 0; }
  function position(id) {
    var p = problems.filter(function (x) { return x.id === id; })[0], sec = sectionOf(p);
    var inSec = problems.filter(function (x) { return sectionOf(x) === sec; });
    return { section: sec, hasSections: sec > 0, n: inSec.indexOf(p) + 1 };
  }
  // Left sidebar: Section headings with their problems; only problems of this paper are listed.
  var shut = {};   // section number -> collapsed
  function renderSide(activeId) {
    var side = $("side"), done = solvedSet(); side.textContent = "";
    var top = el("div", "top");
    var back = el("button", "back2"); back.type = "button"; back.innerHTML = icon("back") + " Back"; back.addEventListener("click", leave);
    var col = el("button", "collapse"); col.type = "button"; col.title = "Show or hide this panel"; col.setAttribute("aria-label", "Show or hide this panel"); col.innerHTML = icon("panel");
    col.addEventListener("click", function () { $("app").classList.toggle("side-collapsed"); });
    top.appendChild(back); top.appendChild(col); side.appendChild(top);
    side.appendChild(el("h4", "", split(problems[0]).paper));
    var secs = [];
    problems.forEach(function (p) { var n = sectionOf(p); if (secs.indexOf(n) < 0) secs.push(n); });
    secs.forEach(function (sec) {
      var list = problems.filter(function (p) { return sectionOf(p) === sec; });
      if (list.some(function (p) { return p.id === activeId; })) shut[sec] = false;
      var g = el("div", "gsec s" + (sec || 1) + (shut[sec] ? " shut" : ""));
      if (sec > 0) {
        var h = el("button", "sechead"); h.type = "button"; h.innerHTML = "<span>Section " + sec + "</span>" + icon("chevron", 14);
        h.addEventListener("click", function () { shut[sec] = !shut[sec]; g.classList.toggle("shut", shut[sec]); });
        g.appendChild(h);
      }
      list.forEach(function (p, i) {
        var b = el("button", "item" + (p.id === activeId ? " on" : "")); b.type = "button";
        b.appendChild(el("span", "", "Problem " + (i + 1)));
        if (done.indexOf(p.id) >= 0) { var t = el("span", "tick"); t.innerHTML = icon("check", 14); b.appendChild(t); }
        b.title = split(p).name;
        b.addEventListener("click", function () { if (p.id !== activeId) openProblem(p.id); });
        g.appendChild(b);
      });
      side.appendChild(g);
    });
  }
  function startPaper(paper, id) {
    problems = paper.problems;
    openProblem(id || problems[0].id);
  }
  // Back returns to the course practice page with the coding tab of this paper open.
  function leave() {
    var t = problems.length ? typeOf(split(problems[0]).paper) : null;
    location.assign("/practice/" + encodeURIComponent(courseSlug) + (t ? "?ide=" + encodeURIComponent(t) : ""));
  }

  function boot() {
    if (!token) return loginPrompt();
    api("/courses/" + encodeURIComponent(courseSlug) + "/ide-problems").then(function (res) {
      var byName = {};
      res.weeks.forEach(function (w) {
        w.problems.forEach(function (p) {
          var name = split(p).paper;
          if (!byName[name]) { byName[name] = { name: name, problems: [] }; papers.push(byName[name]); }
          byName[name].problems.push(p);
        });
      });
      if (!papers.length) return status(document.createTextNode("No IDE problems in this course yet."));
      var want = Number(params.get("problem"));
      var owner = papers.filter(function (pp) { return pp.problems.some(function (p) { return p.id === want; }); })[0];
      // Papers are chosen on the practice page; a link without a valid question goes back there.
      if (owner) startPaper(owner, want); else location.replace("/practice/" + encodeURIComponent(courseSlug));
    }).catch(function (e) { if (e.status === 401) loginPrompt(); else status(document.createTextNode(e.message)); });
  }
  boot();
})();
</script>
</body>
</html>
