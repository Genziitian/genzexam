<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https:; connect-src 'self' https://labapi.genziitian.in; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Student uploads · Manager · Quiz LAB</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/manager-discussions.css?v=20261017b" />
    <link rel="stylesheet" href="/ql-dark-discussions.css?v=20261010a" />

<script src="/ql-loading.js?v=20261017a"></script>

<script src="/manager-shell.js?v=20261017a" defer></script>
</head>
  <body>
    <span id="me" hidden></span>
    <main>
      <div class="heading">
        <div>
          <h1>Student uploads</h1>
        </div>
        <button type="button" id="refresh">Refresh</button>
      </div>
      <div id="gate" class="notice" role="status">Checking your manager account…</div>
      <div id="workspace" hidden>
        <div class="rep-tabs" role="group" aria-label="Show uploads">
          <button type="button" data-state="new" aria-pressed="true">To review <b id="c-new">0</b></button>
          <button type="button" data-state="published" aria-pressed="false">Published <b id="c-published">0</b></button>
          <button type="button" data-state="all" aria-pressed="false">All</button>
          <input type="search" id="search" placeholder="Search paper or student" autocomplete="off" />
        </div>
        <div id="list" class="rep-list"></div>
      </div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/storefront-runtime.js?v=20261017a"></script>
    <script src="/manager-uploads.js?v=20261017a"></script>
  </body>
</html>
